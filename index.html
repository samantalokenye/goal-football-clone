<head>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">

<body class="bg-gray-100 text-gray-900">

    <header class="bg-black text-white">

        <div class="max-w-7xl mx-auto px-4">

                    <a href="latest-news.html" class="text-sm font-medium hover:text-gray-300 transition">News</a>

                    <a href="#" class="text-sm font-medium hover:text-gray-300 transition"> Transfers</a>

                    <a href="#" class="text-sm font-medium hover:text-gray-300 transition"> Scores</a>

                    <a href="#" class="text-sm font-medium hover:text-gray-300 transition"> Teams</a>

                <div class="flex items-center gap-4">

                    <button type="button" aria-label="Search" class="hover:text-gray-300 transition">

                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"stroke-width="2" stroke="currentColor"
                        class="w-5 h-5">

                        </svg>

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">

                <button id="menu-button" type="button" aria-label="Open menu" class="md:hidden hover:text-gray-300 transition">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">

                <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg></button>
                </div>

                <!-- Scores -->

            </p>
        </div>
    </div>

    <!-------- MAIN CONTENT ------->
    <main class="max-w-7xl mx-auto px-4 py-10">
        <h1 class="text-3xl font-bold">Football News </h1>
        <p class="mt-2 text-gray-600">Latest football news and updates.</p>

    <!------JAVASCRIPT---->
    <script src="./js/main.js"></script>
